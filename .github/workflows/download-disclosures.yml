name: Download Disclosures

on:
  workflow_dispatch:
    inputs:
      bank:
        description: 'Bank ID to download (leave blank for all confirmed)'
        required: false
        default: ''
      force:
        description: 'Force re-download even if file exists'
        required: false
        default: 'false'
        type: boolean

jobs:
  download:
    name: Download disclosure PDFs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: "pip"
      - name: Install dependencies
        run: pip install -e .
      - name: Download disclosures
        run: |
          ARGS="--batch"
          if [ -n "${{ inputs.bank }}" ]; then ARGS="$ARGS --bank ${{ inputs.bank }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/download_disclosures.py $ARGS
      - name: Commit downloaded PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/financial_disclosures/
          if git diff --cached --quiet; then
            echo "INFO No new disclosures downloaded"
          else
            git commit -m "data: download disclosure PDFs [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
