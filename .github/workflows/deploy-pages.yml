name: Deploy GitHub Pages

# Builds the static GitHub Pages site from docs/ and deploys it.
# The docs/index.html is a static page that consumes data stored in the repo.
#
# Trigger: manual only (workflow_dispatch from the Actions tab),
#          or push to main that touches docs/ or data/processed/.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/processed/**"

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
