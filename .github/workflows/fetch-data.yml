name: Fetch Data

# Downloads the RBNZ Bank Financial Strength Dashboard XLSX and commits
# it to data/raw/.  The workflow is idempotent — re-running it will
# overwrite the existing file with the latest version.
#
# Triggers: workflow_dispatch (manual) and a monthly schedule on the 1st
# of each month at 06:00 UTC, to pick up the latest RBNZ quarterly release.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

jobs:
  fetch:
    name: Fetch RBNZ Dashboard XLSX
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Fetch data sources
        run: python scripts/fetch_data.py

      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "INFO No changes — data is already up to date"
          else
            git commit -m "data: fetch RBNZ dashboard XLSX [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
