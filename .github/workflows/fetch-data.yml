name: Fetch Data

# Downloads the RBNZ Bank Financial Strength Dashboard XLSX and commits
# it to data/raw/.  The workflow is idempotent — re-running it will
# overwrite the existing file with the latest version.
#
# Trigger: manual only (workflow_dispatch from the Actions tab).

on:
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch RBNZ Dashboard XLSX
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Fetch data sources
        run: |
          python - <<'EOF'
          import logging
          import sys
          from pathlib import Path
          import httpx
          from src.config import load_sources
          from src.logger import get_logger

          logger = get_logger("fetch-data")
          logging.basicConfig(level=logging.INFO)

          sources = load_sources()
          rbnz = sources.get("rbnz", {})
          for source in rbnz.get("xlsx_sources", []):
              url = source["url"]
              dest = Path(source["output_file"])
              dest.parent.mkdir(parents=True, exist_ok=True)
              logger.info("Fetching %s -> %s", url, dest)
              with httpx.stream("GET", url, follow_redirects=True, timeout=120.0) as r:
                  r.raise_for_status()
                  with dest.open("wb") as fh:
                      for chunk in r.iter_bytes(chunk_size=65536):
                          fh.write(chunk)
              logger.info("Saved %s (%d bytes)", dest, dest.stat().st_size)
          EOF

      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "INFO No changes — data is already up to date"
          else
            git commit -m "data: fetch RBNZ dashboard XLSX [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
