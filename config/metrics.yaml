# Metrics mapping configuration
# Maps raw data field names from source files to canonical glossary terms.
# Populated from spike S-0001 (RBNZ XLSX structure investigation).
#
# Format:
#   mappings:
#     <source_id>:
#       <series_id>: <canonical_metric_name>
#
# Canonical metric names are defined in glossary.md.
# Source IDs match the source identifier stamped on processed rows (e.g. "rbnz-dashboard").
# Series IDs are taken from the "Series Id" row (row 5) of the RBNZ XLSX Data sheet.

mappings:
  rbnz-dashboard:
    # --- Capital adequacy ---
    DBB.QIB10: "Total Capital Ratio"
    DBB.QIB12: "CET1 Ratio"
    DBB.QIB14: "Tier 1 Capital Ratio"
    DBB.QIB90: "Total Risk-Weighted Assets"

    # --- Asset quality (total loans) ---
    DBB.QIC10: "NPL Ratio"
    DBB.QIC50: "Total Non-Performing Loans"
    DBB.QIC60: "Individual Provisions"
    DBB.QIC70: "Collective Provisions"

    # --- Profitability ---
    DBB.QIE10: "Return on Assets"
    DBB.QIE13: "Return on Equity"
    DBB.QIE15: "NIM"
    DBB.QIE40: "Net Interest Income"
    DBB.QIE50: "Trading and Hedging Gains"
    DBB.QIE55: "Fees and Commission Income"
    DBB.QIE57: "Other Income"
    DBB.QIE60: "Operating Expenses"
    DBB.QIE90: "Profit After Tax"

    # --- Balance sheet ---
    DBB.QIG10: "Total Assets"
    DBB.QIG20: "Cash Position"
    DBB.QIG30: "Net Loans and Advances"
    DBB.QIG55: "Deposits"
    DBB.QIG90: "Equity"

    # --- Liquidity ---
    DBB.QIH30: "Core Funding Ratio (CFR)"
    DBB.QIH10: "1-Month Mismatch Ratio"
    DBB.QIH20: "1-Week Mismatch Ratio"

    # --- Credit concentration ---
    DBB.QIJ10: "Top 5 Non-Bank Credit Exposures"
    DBB.QIJ30: "Top 5 Bank Credit Exposures"
    DBB.QIJ40: "Bank Exposures ≥10% of CET1"

# Controllability classification for each canonical metric.
# How much a bank's management can directly influence the metric's value.
# Valid values: High | Medium | Low | Hybrid
# See glossary.md for definitions of each controllability level.
controllability:
  # --- Capital adequacy ---
  "CET1 Ratio":                     "High"
  "Tier 1 Capital Ratio":           "High"
  "Total Capital Ratio":            "High"
  "Total Risk-Weighted Assets":     "Medium"
  "Capital Headroom":               "High"
  "Risk Density":                   "Medium"

  # --- Asset quality ---
  "NPL Ratio":                      "Low"
  "Total Non-Performing Loans":     "Low"
  "Individual Provisions":          "Medium"
  "Collective Provisions":          "Medium"
  "Provisioning Coverage":          "Medium"
  "Credit Impairment Rate":         "Low"

  # --- Profitability ---
  "Return on Assets":               "Medium"
  "Return on Equity":               "Medium"
  "NIM":                            "Hybrid"
  "Net Interest Income":            "Hybrid"
  "Trading and Hedging Gains":      "Low"
  "Fees and Commission Income":     "High"
  "Other Income":                   "Medium"
  "Operating Expenses":             "High"
  "Profit After Tax":               "Medium"
  "Cost to Income Ratio":           "High"
  "RORWA":                          "Medium"
  "Pre-Provision Profit":           "Medium"
  "Non-Interest Income Share":      "Medium"
  "Opex Intensity":                 "High"

  # --- Balance sheet ---
  "Total Assets":                   "Medium"
  "Cash Position":                  "Medium"
  "Net Loans and Advances":         "Medium"
  "Deposits":                       "Low"
  "Equity":                         "High"
  "Loan-to-Deposit Ratio":          "Medium"

  # --- Liquidity ---
  "Core Funding Ratio (CFR)":       "Medium"
  "1-Month Mismatch Ratio":         "Low"
  "1-Week Mismatch Ratio":          "Low"

  # --- Credit concentration ---
  "Top 5 Non-Bank Credit Exposures": "High"
  "Top 5 Bank Credit Exposures":     "High"
  "Bank Exposures ≥10% of CET1":     "High"

  # --- Productivity ---
  "Profit per Employee":            "Medium"
  "Gross Income per Employee":      "Medium"
  "Expenses per Employee":          "High"
  "Profit per Customer":            "Medium"
  "Gross Income per Customer":      "Medium"
  "Expenses per Customer":          "High"
