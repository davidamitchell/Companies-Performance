# Sources configuration
# Defines data sources for the Companies Performance pipeline.
# Each source is fetched when running the fetch-data workflow.

rbnz:
  # RBNZ Bank Financial Strength Dashboard — primary data source.
  # Fetched via the fetch-data GitHub Actions workflow (manual trigger only).
  xlsx_sources:
    - url: https://bankdashboard.rbnz.govt.nz/datafiles/Bank-Financial-Strength-Dashboard-Data.xlsx
      name: "RBNZ Bank Financial Strength Dashboard"
      description: >
        Reserve Bank of New Zealand Bank Dashboard data.
        Covers capital adequacy, liquidity, asset quality, and profitability
        metrics for registered banks in New Zealand.
      output_file: data/raw/rbnz-dashboard.xlsx
      # Fallback for development: manually committed file (see ADR-0003).
      # Used by process_data.py when output_file is absent (fetch workflow not yet run).
      committed_file: data/Bank-Financial-Strength-Dashboard-Data.xlsx

ocr:
  # RBNZ B2 series — Official Cash Rate and wholesale interest rates.
  # Provides macroeconomic context for bank performance metrics.
  xlsx_sources:
    - url: https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/b/b2/hb2-monthly-close.xlsx
      name: "RBNZ B2 Wholesale Interest Rates (Monthly Close)"
      description: >
        Reserve Bank of New Zealand B2 series.
        Contains the Official Cash Rate (OCR), 90-day bank bill rate,
        and NZD interest rate swap rates at monthly close.
        Used to provide macroeconomic context for bank performance metrics.
      output_file: data/raw/rbnz-ocr.xlsx
      investor_relations_url: https://www.rbnz.govt.nz/statistics/series/data-file-index-page

financial_disclosures:
  # Bank General Disclosure Statements (GDS) — half-yearly and annual PDF reports.
  # URLs are validated by scripts/validate_disclosure_urls.py.
  # status field: confirmed = URL verified reachable; pending = URL inferred, not yet validated.
