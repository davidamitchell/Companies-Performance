<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NZ Bank Performance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    /* ── Page-specific overrides ────────────────────────────────────────────── */

    /* Status line */
    #status { font-size: var(--text-xs); color: var(--teal); margin-top: 0.4rem;
              letter-spacing: 0.04em; }

    /* Bank selector */
    .bank-selector { margin-top: 1.25rem; }
    .bank-selector-label {
      font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.75rem; letter-spacing: 0.05em;
    }
    .quick-btn {
      background: transparent; border: 1px solid var(--border);
      padding: 0.15rem 0.5rem; font-size: var(--text-xs); cursor: pointer;
      color: var(--text-muted); font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.05em;
    }
    .quick-btn:hover { border-color: var(--teal); color: var(--text); }
    .bank-checks { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }
    .bank-check-label {
      display: flex; align-items: center; gap: 0.3rem;
      background: var(--surface); border: 1px solid var(--border);
      padding: 0.2rem 0.6rem; font-size: var(--text-xs); cursor: pointer;
      transition: border-color 150ms ease; color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .bank-check-label:hover { border-color: var(--teal); color: var(--text); }
    .bank-check-label input { display: none; }
    .bank-check-label.checked {
      background: var(--bank-color, var(--teal));
      border-color: var(--bank-color, var(--teal));
      color: #fff;
    }

    /* Chart grid */
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 1rem;
    }
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
    }
    .chart-card h3 {
      font-size: var(--text-xs); font-weight: 500; color: var(--text-muted);
      margin-bottom: 0.6rem; letter-spacing: 0.08em; text-transform: lowercase;
    }
    .chart-wrap { position: relative; height: 220px; }

    /* Snapshot table */
    .snapshot-wrap { overflow-x: auto; }
    .entity-cell { font-weight: 500; display: flex; align-items: center; gap: 0.4rem; }
    .swatch { width: 8px; height: 8px; flex-shrink: 0; }
    .val-null { color: var(--text-muted); }
    .trend-up   { color: var(--teal); font-size: var(--text-xs); margin-left: 0.15rem; }
    .trend-down { color: var(--dusk); font-size: var(--text-xs); margin-left: 0.15rem; }

    /* Override shared section-heading for dashboard sections */
    .section-title {
      font-size: var(--text-xs); font-weight: 500; margin-bottom: 1rem;
      display: flex; align-items: baseline; gap: 0.5rem;
      text-transform: lowercase; letter-spacing: 0.1em; color: var(--text-muted);
      border-bottom: 1px solid var(--border); padding-bottom: 0.4rem;
    }
    .section-title span { color: var(--text-muted); }

    /* Range filter */
    .range-filter {
      display: flex; align-items: center; gap: 0.5rem;
      margin-top: 0.75rem; flex-wrap: wrap;
    }
    .range-filter-label {
      font-size: var(--text-xs); color: var(--text-muted); letter-spacing: 0.05em;
    }
    .range-btn {
      background: transparent; border: 1px solid var(--border);
      padding: 0.15rem 0.5rem; font-size: var(--text-xs); cursor: pointer;
      color: var(--text-muted); font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.05em; transition: border-color 150ms ease, color 150ms ease;
    }
    .range-btn:hover { border-color: var(--teal); color: var(--text); }
    .range-btn.active { border-color: #00C3A5; color: var(--text); }

    @media (max-width: 640px) {
      .chart-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="nav-brand" href="index.html">NZ Bank Performance</a>
    <div class="nav-links">
      <a href="data-sources.html">Data Sources</a>
      <a href="glossary.html">Glossary</a>
      <a href="disclosures.html">Disclosures</a>
    </div>
  </div>
</nav>

<div class="page-wrap">

  <div class="page-header">
    <h1>NZ Bank Performance</h1>
    <p>Financial performance metrics — NZ banks and companies, sourced from public disclosures.</p>
    <div id="status">Loading data…</div>

    <div class="bank-selector">
      <div class="bank-selector-label">
        banks shown:
        <button class="quick-btn" id="btn-top6">Top 6</button>
        <button class="quick-btn" id="btn-all">All</button>
        <button class="quick-btn" id="btn-standalone" style="border-color:#00C3A5;color:#00C3A5;">Standalone only</button>
      </div>
      <div class="bank-checks" id="bank-checks"></div>
    </div>
    <div class="range-filter">
      <span class="range-filter-label">period</span>
      <button class="range-btn" data-range="4">Last 4Q</button>
      <button class="range-btn" data-range="8">Last 8Q</button>
      <button class="range-btn" data-range="16">Last 16Q</button>
      <button class="range-btn active" data-range="all">All</button>
    </div>
  </div>

  <main>
    <section id="charts-section">
      <div class="section-title">
        historical performance
        <span id="period-range"></span>
      </div>
      <div class="chart-grid" id="chart-grid"></div>
    </section>

    <section id="snapshot-section">
      <div class="section-title">
        latest quarter snapshot
        <span id="latest-period-label"></span>
      </div>
      <div class="snapshot-wrap">
        <table id="snapshot-table">
          <thead><tr id="snapshot-head"></tr></thead>
          <tbody id="snapshot-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    Data sourced from the <a href="https://bankdashboard.rbnz.govt.nz/" target="_blank" rel="noopener">RBNZ Bank Dashboard</a>
  </footer>

</div>

<script>
  /* ── Chart.js dark-mode defaults ───────────────────────────────────────── */
  Chart.defaults.color          = '#666';
  Chart.defaults.borderColor    = '#252b33';
  Chart.defaults.font.family    = "'IBM Plex Mono', monospace";
  Chart.defaults.font.size      = 10;

  /* ── Configuration ─────────────────────────────────────────────────────── */
  const DATA_URL = 'data/processed/metrics.json';
  const OCR_URL  = 'data/processed/ocr.json';

  // Key metrics to chart and show in snapshot.
  // 'Cost to Income Ratio' is derived client-side (not stored in data).
  const KEY_METRICS = [
    'Cost to Income Ratio',
    'Return on Equity',
    'Return on Assets',
    'NIM',
    'RORWA',
    'Risk Density',
    'Provisioning Coverage',
  ];

  const METRIC_LABELS = {
    'Cost to Income Ratio':  'Cost to Income (%)',
    'Return on Equity':      'Return on Equity (%)',
    'Return on Assets':      'Return on Assets (%)',
    'NIM':                   'Net Interest Margin (%)',
    'RORWA':                 'Return on Risk-Weighted Assets (%)',
    'Risk Density':          'Risk Density (%)',
    'Provisioning Coverage': 'Provisioning Coverage (%)',
  };

  // Default banks shown on load.
  const TOP_6_BANKS = ['ANZ', 'ASB', 'BNZ', 'Westpac', 'Kiwibank', 'Rabobank'];

  // All standalone (non-group) entities.
  const STANDALONE = ['ANZ','ASB','BNZ','Westpac','Kiwibank','Rabobank','TSB','SBS','Co-op',
                      'Heartland','ICBC','CCB','BOC','BOB','BOI'];

  // Brand colours (approx).
  const BANK_COLORS = {
    'ANZ':      '#0064A3',
    'ASB':      '#C8102E',
    'BNZ':      '#231F20',
    'Westpac':  '#D5001C',
    'Kiwibank': '#1B7A3E',
    'Rabobank': '#FF6600',
    'TSB':      '#5B3FA6',
    'SBS':      '#005BAA',
    'Co-op':    '#2ECC71',
    'Heartland':'#F39C12',
    'ICBC':     '#E74C3C',
    'CCB':      '#8E44AD',
    'BOC':      '#16A085',
    'BOB':      '#D35400',
    'BOI':      '#2C3E50',
    'ANZ Group':'#7FB3D3',
    'WBC Group':'#E8929A',
    'CBA Group':'#95A5A6',
    'BOC Group':'#76D7C4',
    'CCB Group':'#C39BD3',
    'Rabo Group':'#FAD7A0',
    'ICBC Group':'#F1948A',
  };
  function bankColor(name) {
    return BANK_COLORS[name] || '#636e72';
  }

  /* ── State ─────────────────────────────────────────────────────────────── */
  let allRows  = [];
  let allPeriods = [];
  let allEntities = [];
  let selectedEntities = new Set(TOP_6_BANKS);
  let charts = [];        // Chart.js instances
  let ocrRows = [];       // OCR canonical rows [{entity,metric,value,period,source}]
  let rangePreset = localStorage.getItem('rangePreset') || 'all';

  /* ── Derived data: Cost to Income Ratio ───────────────────────────────── */
  /**
   * Build a nested map: entity → period → metric → value
   * and add a computed 'Cost to Income Ratio' entry where possible.
   */
  function buildLookup(rows) {
    const lookup = {};
    for (const r of rows) {
      if (!lookup[r.entity]) lookup[r.entity] = {};
      if (!lookup[r.entity][r.period]) lookup[r.entity][r.period] = {};
      lookup[r.entity][r.period][r.metric] = r.value;
    }
    // Compute CIR for each entity+period
    for (const [entity, periods] of Object.entries(lookup)) {
      for (const [period, metrics] of Object.entries(periods)) {
        const opex = metrics['Operating Expenses'];
        const nii  = metrics['Net Interest Income'];
        const trad = metrics['Trading and Hedging Gains'];
        const fees = metrics['Fees and Commission Income'];
        const oth  = metrics['Other Income'];
        // All components must be non-null and income > 0
        if (opex != null && nii != null) {
          const income = nii + (trad ?? 0) + (fees ?? 0) + (oth ?? 0);
          if (income > 0) {
            lookup[entity][period]['Cost to Income Ratio'] =
              Math.round((opex / income) * 1000) / 10; // round to 1dp
          }
        }

        // RORWA = (Profit After Tax / Total Risk-Weighted Assets) × 100
        const pat = metrics['Profit After Tax'];
        const rwa = metrics['Total Risk-Weighted Assets'];
        if (pat != null && rwa != null && rwa !== 0) {
          lookup[entity][period]['RORWA'] =
            Math.round((pat / rwa) * 10000) / 100; // round to 2dp
        }

        // Risk Density = (Total Risk-Weighted Assets / Net Loans and Advances) × 100
        const loans = metrics['Net Loans and Advances'];
        if (rwa != null && loans != null && loans !== 0) {
          lookup[entity][period]['Risk Density'] =
            Math.round((rwa / loans) * 10000) / 100; // round to 2dp
        }

        // Provisioning Coverage = ((Individual Provisions + Collective Provisions) / Total Non-Performing Loans) × 100
        const indProv  = metrics['Individual Provisions'];
        const colProv  = metrics['Collective Provisions'];
        const npl      = metrics['Total Non-Performing Loans'];
        if (indProv != null && colProv != null && npl != null && npl !== 0) {
          lookup[entity][period]['Provisioning Coverage'] =
            Math.round(((indProv + colProv) / npl) * 10000) / 100; // round to 2dp
        }
      }
    }
    return lookup;
  }

  /* ── Data loading ─────────────────────────────────────────────────────── */
  async function loadData() {
    const statusEl = document.getElementById('status');
    try {
      const resp = await fetch(DATA_URL);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      allRows = await resp.json();

      allPeriods  = [...new Set(allRows.map(r => r.period))].sort();
      allEntities = [...new Set(allRows.map(r => r.entity))].sort();

      statusEl.textContent =
        `${allRows.length.toLocaleString()} metric rows — ` +
        `${allPeriods[0]} to ${allPeriods[allPeriods.length - 1]}.`;

      buildBankSelector();
      applyRangePreset(rangePreset, false);
      render();
    } catch (err) {
      statusEl.textContent =
        'No data yet — trigger the fetch-data then process-data workflows.';
      statusEl.style.color = '#666';
      console.warn('Data load failed:', err);
    }

    // Load OCR data independently — failure is non-fatal
    try {
      const ocrResp = await fetch(OCR_URL);
      if (ocrResp.ok) {
        ocrRows = await ocrResp.json();
        render(); // re-render with OCR overlay
      }
    } catch (err) {
      console.warn('OCR data load failed (NIM chart will render without OCR overlay):', err);
    }
  }

  /* ── Bank selector ────────────────────────────────────────────────────── */
  function buildBankSelector() {
    const container = document.getElementById('bank-checks');
    container.innerHTML = '';
    for (const entity of allEntities) {
      const label = document.createElement('label');
      label.className = 'bank-check-label' + (selectedEntities.has(entity) ? ' checked' : '');
      label.style.setProperty('--bank-color', bankColor(entity));
      label.innerHTML = `<input type="checkbox" value="${escHtml(entity)}"${selectedEntities.has(entity) ? ' checked' : ''}>${escHtml(entity)}`;
      label.addEventListener('change', e => {
        if (e.target.checked) {
          selectedEntities.add(entity);
          label.classList.add('checked');
        } else {
          selectedEntities.delete(entity);
          label.classList.remove('checked');
        }
        render();
      });
      container.appendChild(label);
    }
  }

  function applySelection(entities) {
    selectedEntities = new Set(entities);
    document.querySelectorAll('.bank-check-label').forEach(label => {
      const cb = label.querySelector('input');
      const entity = cb.value;
      const sel = selectedEntities.has(entity);
      cb.checked = sel;
      label.classList.toggle('checked', sel);
    });
    render();
  }

  document.getElementById('btn-top6').addEventListener('click', () => applySelection(TOP_6_BANKS));
  document.getElementById('btn-all').addEventListener('click', () => applySelection(allEntities));
  document.getElementById('btn-standalone').addEventListener('click', () => {
    // Derive group entities from the data using entity_type field rather than hardcoded names
    const groupEntities = new Set(allRows.filter(r => r.entity_type === 'group').map(r => r.entity));
    applySelection(allEntities.filter(e => !groupEntities.has(e)));
  });

  /* ── Range filter ─────────────────────────────────────────────────────── */
  /**
   * Apply a period range preset.
   * @param {string|number} preset - 'all', 4, 8, or 16 (quarters)
   * @param {boolean} [doRender=true] - Whether to trigger a re-render
   */
  function applyRangePreset(preset, doRender = true) {
    rangePreset = String(preset);
    localStorage.setItem('rangePreset', rangePreset);
    // Update button styles
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.range === rangePreset);
    });
    if (doRender) render();
  }

  /** Return the filtered period array based on the active range preset. */
  function getVisiblePeriods() {
    const n = parseInt(rangePreset, 10);
    if (!isNaN(n) && n > 0 && allPeriods.length > n) {
      return allPeriods.slice(-n);
    }
    return allPeriods;
  }

  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => applyRangePreset(btn.dataset.range));
  });

  /* ── Render ───────────────────────────────────────────────────────────── */
  function render() {
    const lookup = buildLookup(allRows);
    const visible = allEntities.filter(e => selectedEntities.has(e));
    const visiblePeriods = getVisiblePeriods();

    renderCharts(lookup, visible, visiblePeriods);
    renderSnapshot(lookup, visible, visiblePeriods);

    const latestPeriod = visiblePeriods[visiblePeriods.length - 1] || '';
    document.getElementById('latest-period-label').textContent = latestPeriod;
    document.getElementById('period-range').textContent =
      visiblePeriods.length ? `${visiblePeriods[0]} – ${visiblePeriods[visiblePeriods.length - 1]}` : '';
  }

  /* ── Charts ───────────────────────────────────────────────────────────── */
  /**
   * Build an OCR period→value lookup from the loaded ocrRows.
   * @returns {Object} period → OCR value (%)
   */
  function buildOcrLookup() {
    const ocr = {};
    for (const r of ocrRows) {
      ocr[r.period] = r.value;
    }
    return ocr;
  }

  function renderCharts(lookup, visible, visiblePeriods) {
    // Destroy existing charts
    charts.forEach(c => c.destroy());
    charts = [];

    const grid = document.getElementById('chart-grid');
    grid.innerHTML = '';

    const ocrLookup = buildOcrLookup();
    const isNimChart = (metric) => metric === 'NIM';

    for (let i = 0; i < KEY_METRICS.length; i++) {
      const metric = KEY_METRICS[i];
      const label  = METRIC_LABELS[metric] || metric;
      const addOcr = isNimChart(metric) && ocrRows.length > 0;

      const card = document.createElement('div');
      card.className = 'chart-card';
      card.innerHTML = `<h3>${escHtml(label)}</h3><div class="chart-wrap"><canvas id="chart-${i}"></canvas></div>`;
      grid.appendChild(card);

      const datasets = visible.map(entity => {
        const data = visiblePeriods.map(p => {
          const v = lookup[entity]?.[p]?.[metric];
          return (v != null) ? v : null;
        });
        return {
          label: entity,
          data,
          borderColor: bankColor(entity),
          backgroundColor: bankColor(entity) + '22',
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.3,
          spanGaps: false,
          yAxisID: 'y',
        };
      }).filter(ds => ds.data.some(v => v != null));

      // Add OCR overlay on NIM chart only
      if (addOcr) {
        const ocrData = visiblePeriods.map(p => {
          const v = ocrLookup[p];
          return (v != null) ? v : null;
        });
        if (ocrData.some(v => v != null)) {
          datasets.push({
            label: 'OCR (%)',
            data: ocrData,
            borderColor: '#00C3A5',
            backgroundColor: 'transparent',
            borderWidth: 2,
            borderDash: [5, 3],
            pointRadius: 0,
            pointHoverRadius: 4,
            tension: 0.3,
            spanGaps: true,
            yAxisID: 'yOCR',
          });
        }
      }

      const ctx = document.getElementById(`chart-${i}`).getContext('2d');

      const scalesConfig = {
        x: {
          ticks: {
            font: { size: 10, family: "'IBM Plex Mono', monospace" },
            color: '#666',
            maxRotation: 45,
            autoSkip: true,
            maxTicksLimit: 16,
          },
          grid: { display: false },
          border: { color: '#252b33' },
        },
        y: {
          ticks: { font: { size: 10, family: "'IBM Plex Mono', monospace" }, color: '#666' },
          grid: { color: '#252b33' },
          border: { color: '#252b33' },
        },
      };

      if (addOcr) {
        scalesConfig.yOCR = {
          type: 'linear',
          position: 'right',
          title: {
            display: true,
            text: 'OCR (%)',
            color: '#00C3A5',
            font: { size: 9, family: "'IBM Plex Mono', monospace" },
          },
          ticks: { font: { size: 9, family: "'IBM Plex Mono', monospace" }, color: '#00C3A5' },
          grid: { drawOnChartArea: false },
          border: { color: '#252b33' },
        };
      }

      const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: visiblePeriods, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                font: { size: 10, family: "'IBM Plex Mono', monospace" },
                boxWidth: 10, padding: 8, color: '#666',
              },
            },
            tooltip: {
              backgroundColor: '#161b22',
              borderColor: '#252b33',
              borderWidth: 1,
              titleColor: '#e6e6e6',
              bodyColor: '#e6e6e6',
              callbacks: {
                label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y != null ? ctx.parsed.y.toFixed(1) : '—'}`,
              },
            },
          },
          scales: scalesConfig,
        },
      });
      charts.push(chart);
    }
  }

  /* ── Snapshot table ───────────────────────────────────────────────────── */
  function renderSnapshot(lookup, visible, visiblePeriods) {
    const latestPeriod = visiblePeriods[visiblePeriods.length - 1];
    const prevPeriod   = visiblePeriods[visiblePeriods.length - 2];

    // Header
    const head = document.getElementById('snapshot-head');
    head.innerHTML = '<th>Bank</th>' +
      KEY_METRICS.map(m => `<th>${escHtml(METRIC_LABELS[m] || m)}</th>`).join('');

    // Rows
    const body = document.getElementById('snapshot-body');
    body.innerHTML = '';
    for (const entity of visible) {
      const latest = lookup[entity]?.[latestPeriod] || {};
      const prev   = lookup[entity]?.[prevPeriod]   || {};
      const tr = document.createElement('tr');
      let cells = `<td><div class="entity-cell">
        <span class="swatch" style="background:${bankColor(entity)}"></span>
        ${escHtml(entity)}
      </div></td>`;
      for (const metric of KEY_METRICS) {
        const val  = latest[metric];
        const pval = prev[metric];
        if (val == null) {
          cells += `<td class="val-null">—</td>`;
        } else {
          let trend = '';
          if (pval != null) {
            if (val > pval)      trend = '<span class="trend-up">▲</span>';
            else if (val < pval) trend = '<span class="trend-down">▼</span>';
          }
          cells += `<td>${val.toFixed(1)}${trend}</td>`;
        }
      }
      tr.innerHTML = cells;
      body.appendChild(tr);
    }
  }

  /* ── Utilities ────────────────────────────────────────────────────────── */
  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadData();
</script>
</body>
</html>
